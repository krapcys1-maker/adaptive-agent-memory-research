name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # Full history is required: several tests verify frozen artifacts by
      # running `git show <freeze-commit>:<path>`, which fails on a shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run test suite
        run: python -m pytest -q

  memory-kernel-py314:
    name: Memory kernel (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      # The writing agent runs on Python 3.14 and imports scripts/wmb/memory_kernel.py
      # as a single standard-library file, so its tests run there with nothing but pytest.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install pytest only
        run: python -m pip install pytest

      - name: Run the memory kernel tests
        run: python -m pytest -q tests/test_wmb_memory_kernel.py tests/test_wmb_kernel_v2.py tests/test_wmb_memory_kernel_mutants.py tests/test_wmb_mutation_runner.py

  kernel-mutations:
    name: Kernel mutations (${{ matrix.line }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - line: "0.1.0"
            module: scripts/wmb/memory_kernel.py
          - line: "0.2.0"
            module: scripts/wmb/kernel/memory_kernel.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest only
        run: python -m pip install pytest
      - name: Check registered mutations in temporary copies
        run: python scripts/wmb/mutate_kernel.py --module "${{ matrix.module }}" --workers 2

  lifesim-portability:
    name: LifeSim (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.13", "3.14"]
    steps:
      - name: Enable long paths on Windows before checkout
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Record platform and interpreter
        run: |
          python -VV
          python -c "import platform; print(platform.platform(), platform.machine())"
      - name: Install pytest only
        run: python -m pip install pytest
      - name: Check pinned golden vectors
        run: python -m pytest -q tests/test_lifesim_rng.py tests/test_lifesim_world.py -k golden
      - name: Check dependency-light LifeSim suites
        run: >-
          python -m pytest -q tests/test_lifesim_rng.py tests/test_lifesim_world.py
          tests/test_lifesim_schema.py tests/test_lifesim_vocab.py tests/test_lifesim_scorers.py
          tests/test_lifesim_queries.py tests/test_lifesim_verbalise.py tests/test_lifesim_channel.py
          tests/test_lifesim_appraisal.py tests/test_lifesim_integration.py

  memory-integrity:
    name: Project-memory integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify canonical memory log
        run: python scripts/verify_memory_integrity.py --format text

  claim-audit:
    name: Repository claim audit
    runs-on: ubuntu-latest
    steps:
      # Full history is required: the audit compares declared digests against
      # Git blob bytes as well as working-copy bytes.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Blocking on critical findings only: a declared hash that matches neither
      # the working copy nor the Git blob, i.e. a freeze broken after it was
      # declared. A drift explained by a <manifest>.DRIFT.json note is reported as
      # low and does not block; medium and low findings are printed and do not
      # fail the job. A broken freeze is caught the day it is introduced rather
      # than discovered months later by an external reviewer.
      - name: Audit declared hashes, registry paths, and cross-references
        run: python scripts/audit_repository_claims.py --format text

  canonical-store-guard:
    name: Canonical store guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject rewrites of append-only memory
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          if ! git diff --quiet "$base" -- memory/events.jsonl; then
            removed=$(git diff --numstat "$base" -- memory/events.jsonl | awk '{print $2}')
            if [ "${removed:-0}" -ne 0 ]; then
              echo "::error file=memory/events.jsonl::events.jsonl is append-only; this pull request deletes or rewrites $removed line(s)."
              echo "Use memory_supersede to revise a conclusion. Never edit or remove a prior event."
              exit 1
            fi
            echo "events.jsonl grew by $(git diff --numstat "$base" -- memory/events.jsonl | awk '{print $1}') appended line(s)."
          else
            echo "events.jsonl unchanged."
          fi

      - name: Reject committed disposable index
        run: |
          if git ls-files --error-unmatch memory/.index >/dev/null 2>&1; then
            echo "::error::memory/.index is a rebuildable local index and must never be committed."
            exit 1
          fi
          echo "No disposable index tracked."
